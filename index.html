/* LOADING */

.meal-plan-day{background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;border:1px solid var(--border)}

.ai-input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:24px;padding:10px 15px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;transition:border-color .2s}

.progress-chart{background:var(--surface2);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px}

.week-schedule{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}

.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}

.btn-primary{width:100%;padding:13px;border-radius:10px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;letter-spacing:.5px}

.btn-outline{padding:8px 13px;border-radius:9px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-weight:600;font-size:12px;cursor:pointer;transition:all .2s}
.btn-outline.active{border-color:var(--accent);color:var(--accent)}

.divider{height:1px;background:var(--border);margin:10px 0}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-accent{background:var(--accent);color:#000}
.badge-info{background:#47c8ff22;color:var(--accent2);border:1px solid #47c8ff44}
.badge-rob{background:#ff6b4722;color:var(--rob);border:1px solid #ff6b4744}
.badge-tre{background:#47c8ff22;color:var(--tre);border:1px solid #47c8ff44}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.micro{font-size:11px;color:var(--text3)}
.mt-8{margin-top:8px}
.mt-10{margin-top:10px}
.gap-8{gap:8px}

/* STREAK */
.streak-row{display:flex;gap:5px;margin-bottom:6px}

.streak-day.today{border-color:var(--accent);color:var(--accent)}

.water-drops{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.drop.filled{background:var(--accent2);border-color:var(--accent2)}

/* PR */
.pr-tag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;background:linear-gradient(135deg,var(--accent),var(--warning));color:#000;padding:1px 5px;border-radius:3px}

/* TOAST */
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}

// STATE + LOCALSTORAGE PERSISTENCE
// ===================================================
let currentView = 'both';
let currentPage = 'dashboard';

function loadState() {
  try {
    const today = new Date().toDateString();
    const saved = JSON.parse(localStorage.getItem('fitforge_state') || '{}');
    const todayKey = today.replace(/ /g,'_');
    // Load history across all days — never wipe it
    const history = saved.history || {};
    const todayData = history[todayKey] || {};
    return {
      date: today,
      waterCups: todayData.waterCups || {rob:0, tre:0},
      completedSets: todayData.completedSets || {},
      loggedExercises: todayData.loggedExercises || {},
      loggedFoods: todayData.loggedFoods || {rob:[], tre:[]},
      weekStreaks: saved.weekStreaks || {rob:[false,false,false,false,false,false,false],tre:[false,false,false,false,false,false,false]},
      aiHistory: saved.aiHistory || [],
      history: history,
    };
  } catch(e) {
    return { date:new Date().toDateString(), waterCups:{rob:0,tre:0}, completedSets:{}, loggedExercises:{},
             loggedFoods:{rob:[],tre:[]}, weekStreaks:{rob:[false,false,false,false,false,false,false],tre:[false,false,false,false,false,false,false]},
             aiHistory:[], history:{} };
  }
}
function saveState() {
  try {
    const todayKey = new Date().toDateString().replace(/ /g,'_');
    const fullHistory = (typeof history !== 'undefined' && history && typeof history === 'object' && !Array.isArray(history)) ? history : {};
    fullHistory[todayKey] = { waterCups, completedSets, loggedExercises, loggedFoods };
    // Keep only last 30 days of history to avoid localStorage overflow
    const keys = Object.keys(fullHistory);
    if(keys.length > 30) { delete fullHistory[keys[0]]; }
    localStorage.setItem('fitforge_state', JSON.stringify({
      weekStreaks, aiHistory, history: fullHistory,
      date: new Date().toDateString()
    }));
  } catch(e) {}
}

function toggleSets(idx){
  const el=document.getElementById(`sets-${idx}`);
  if(el) el.classList.toggle('open');
}

function logSet(exIdx,setIdx,btn){
  // btn is the clicked element; exName derived from the exercise item's data
  const plan=SHARED_PROGRAM[getTodayPlan().key];
  if(!plan)return;
  const ex=plan.exercises[exIdx];
  if(!ex)return;
  const exName=ex.name;
  const numSets=typeof ex.sets==='number'?ex.sets:3;
  const k=exName+'-'+setIdx;
  completedSets[k]=true;
  if(btn){btn.classList.add('logged');btn.textContent='✓';}
  let allDone=true;
  for(let i=0;i<numSets;i++){if(!completedSets[exName+'-'+i]){allDone=false;break;}}
  if(allDone){
    loggedExercises[exName]=true;
    const item=document.getElementById('exitem-'+exIdx);
    if(item)item.classList.add('done');
    weekStreaks.rob[new Date().getDay()]=true;
    weekStreaks.tre[new Date().getDay()]=true;
    renderStreak();
    // Save best weight logged for this exercise to history
    saveExerciseWeight(exIdx, exName, numSets);
    showToast('✅ '+exName+' complete!');
  }
  saveState();
}

function saveExerciseWeight(exIdx, exName, numSets){
  try{
    const todayKey=new Date().toDateString().replace(/ /g,'_');
    const saved=JSON.parse(localStorage.getItem('fitforge_state')||'{}');
    const hist=saved.history||{};
    if(!hist[todayKey]) hist[todayKey]={};
    if(!hist[todayKey].weightLog) hist[todayKey].weightLog={};
    // Find best weight from inputs
    let robBest=0, treBest=0;
    for(let si=0;si<numSets;si++){
      const rw=document.getElementById('rw-'+exIdx+'-'+si);
      const tw=document.getElementById('tw-'+exIdx+'-'+si);
      const sw=document.getElementById('sw-'+exIdx+'-'+si); // single view
      if(rw && parseFloat(rw.value)>robBest) robBest=parseFloat(rw.value)||0;
      if(tw && parseFloat(tw.value)>treBest) treBest=parseFloat(tw.value)||0;
      if(sw){
        const val=parseFloat(sw.value)||0;
        if(currentView==='rob' && val>robBest) robBest=val;
        if(currentView==='tre' && val>treBest) treBest=val;
      }
    }
    hist[todayKey].weightLog[exName]={rob:robBest||hist[todayKey].weightLog[exName]?.rob||0, tre:treBest||hist[todayKey].weightLog[exName]?.tre||0};
    saved.history=hist;
    localStorage.setItem('fitforge_state',JSON.stringify(saved));
  }catch(e){}
}

  foods.forEach(f=>{eaten.cals+=f.cals;eaten.p+=f.p;eaten.c+=f.c;eaten.f+=f.f;});
  const macros=[
    {label:'Cals',val:eaten.cals,max:u.calories,color:'#e8ff47',unit:''},
    {label:'Protein',val:eaten.p,max:u.protein,color:'#ff6b47',unit:'g'},

  const el=document.getElementById(containerId);

    return `<div class="ring-wrap">
      <div class="ring-container">

          <circle class="ring-bg" cx="25" cy="25" r="${r}"/>

// ── Helper: get all saved dates sorted oldest→newest ──────────────────────
function getSavedDates(){
  try{
    const saved=JSON.parse(localStorage.getItem('fitforge_state')||'{}');
    return Object.keys(saved.history||{}).sort((a,b)=>new Date(a.replace(/_/g,' '))-new Date(b.replace(/_/g,' ')));
  }catch(e){return [];}
}
// ── Helper: get best set weight for a given exercise on a given date ──────
function getBestWeightOnDate(dateKey, exName, userPrefix){
  try{
    const saved=JSON.parse(localStorage.getItem('fitforge_state')||'{}');
    const dayData=(saved.history||{})[dateKey]||{};
    const sets=dayData.completedSets||{};
    let best=0;
    Object.keys(sets).forEach(k=>{
      if(k.startsWith(exName+'-')){
        const inputId=(userPrefix==='r'?'rw':'tw')+'-';
        // We stored completion flag not weight — check set inputs
        best=best||1; // just flag as done
      }
    });
    return best;
  }catch(e){return 0;}
}
// ── Helper: get logged food calories for a date/user ─────────────────────
function getCaloriesOnDate(dateKey, who){
  try{
    const saved=JSON.parse(localStorage.getItem('fitforge_state')||'{}');
    const dayData=(saved.history||{})[dateKey]||{};
    const foods=(dayData.loggedFoods||{})[who]||[];
    return foods.reduce((s,f)=>s+(f.cals||0),0);
  }catch(e){return 0;}
}
// ── Helper: get completed exercise count for a date ───────────────────────
function getCompletedCountOnDate(dateKey){
  try{
    const saved=JSON.parse(localStorage.getItem('fitforge_state')||'{}');
    const dayData=(saved.history||{})[dateKey]||{};
    return Object.keys(dayData.loggedExercises||{}).length;
  }catch(e){return 0;}
}

function getStrengthHistory(){
  // Extract best weights logged per exercise per day from localStorage
  try{
    const saved=JSON.parse(localStorage.getItem('fitforge_state')||'{}');
    const hist=saved.history||{};
    const dates=getSavedDates();
    const result={rob:{},tre:{}};
    dates.forEach(dk=>{
      const day=hist[dk]||{};
      // weightLog stores {exName: {rob: kg, tre: kg}} per day
      const wl=day.weightLog||{};
      Object.keys(wl).forEach(ex=>{
        if(!result.rob[ex]) result.rob[ex]=[];
        if(!result.tre[ex]) result.tre[ex]=[];
        result.rob[ex].push({date:dk,kg:wl[ex].rob||0});
        result.tre[ex].push({date:dk,kg:wl[ex].tre||0});
      });
    });
    return result;
  }catch(e){return {rob:{},tre:{}};}
}

  let html='';
  for(let i=0;i<8;i++) html+=`<div class="drop ${i<cups?'filled':''}" onclick="toggleWater(${i})"></div>`;
  document.getElementById('waterDrops').innerHTML=html;
  document.getElementById('waterCount').textContent=`${cups}/8`;
}

function toggleWater(idx){
  if(currentView==='both'){
    // Sync water to both
    const newVal=idx<waterCups.rob?idx:idx+1;
    waterCups.rob=newVal;
    waterCups.tre=newVal;
    renderWater();
    saveState();
    if(newVal>=8) showToast('💧 Both hit hydration goal!');
    else showToast('💧 '+newVal+'/8 cups — both synced');
  } else {
    const who=currentView;
    waterCups[who]=idx<waterCups[who]?idx:idx+1;
    renderWater();
    saveState();
    if(waterCups[who]>=8) showToast('💧 '+(who==='rob'?'Rob':'Tre')+' hit hydration goal!');
  }
}

// ===================================================
const AI_SYSTEM=`You are FitForge AI Coach, expert personal trainer for Rob (53) and Tre (22) who train TOGETHER.

KEY FACTS:
- They do the SAME exercises: Upper/Lower 4-day split (Mon Upper A, Tue Lower A, Thu Upper B, Fri Lower B)
- Wed/Sat: Active recovery / LISS cardio. Sun: Rest.
- Both already train 4 days/week — they are intermediate lifters in good shape
- Rob (53): 87.5kg → 82.5kg goal. 2,400 cal / 180g protein / 240g carbs / 75g fat
- Tre (22): 77.5kg → 85kg lean. 2,800 cal / 210g protein / 300g carbs / 85g fat

BODYWEIGHT MOVEMENTS IN PROGRAM:
- Weighted Dips: Set 1 +30kg, Set 2 +15kg, Set 3 bodyweight AMRAP
- Pull-Ups / Weighted Pull-Ups / Chin-Ups: progressive overload with belt
- Sit-Ups, V-Ups, Toes-to-Bar: core rotation
- Bodyweight movements are a core part of the program — encourage both athletes

SAME EXERCISES — DIFFERENT LOADS:
- Rob: controlled tempo (3-sec descent), joint-friendly loading, excellent form priority, RPE 7-8
- Tre: aggressive progressive overload, maximize load, RPE 8-9, add weight every session

MEAL PLAN: Same foods, different quantities. High protein, moderate carbs, healthy fats. Shared meal prep is encouraged.

Answer questions about workouts, nutrition, recovery, supplements, progressive overload. Keep responses concise for mobile. Reference their specific program. Be motivating for both simultaneously when possible.`;

function renderAI(){
  const el=document.getElementById('aiIntro');
  const viewMsg = currentView==='both'
    ? `Training coach for <strong style="color:var(--rob)">Rob</strong> & <strong style="color:var(--tre)">Tre</strong> — same program, optimized loads. Ask about workouts, nutrition, recovery, or programming.`
    : currentView==='rob'
      ? `Coaching <strong style="color:var(--rob)">Rob (53)</strong> — Upper/Lower 4×/week, 2,400 cal target. Ask anything.`
      : `Coaching <strong style="color:var(--tre)">Tre (22)</strong> — Upper/Lower 4×/week, 2,800 cal target. Ask anything.`;
  if(el) el.innerHTML=viewMsg;
  if(aiHistory.length===0){
    aiHistory.push({role:'assistant',content:`Let's get it! 💪 Rob and Tre, you're on the perfect program — same Upper/Lower split, training together, different loads.\n\nRob: controlled tempo, protect those joints, every rep counts.\nTre: progressive overload every session — add weight or reps every single time.\n\nBoth: hit your protein targets. That's the non-negotiable.\n\nWhat do you want to know?`});
  }
  renderAIMsgs();
}

function renderAIMsgs(){
  const el=document.getElementById('aiMessages');
  if(!el)return;
  el.innerHTML=aiHistory.map(m=>`<div class="ai-msg ${m.role==='assistant'?'ai':'user'}">
    <div class="ai-msg-header">${m.role==='assistant'?'🤖 AI Coach':'👤 You'}</div>
    ${m.content.replace(/\n/g,'<br>')}
  </div>`).join('');
  setTimeout(()=>{el.scrollTop=el.scrollHeight;},80);
}

async function sendAiMessage(){
  const inp=document.getElementById('aiInput');
  const msg=inp.value.trim();
  if(!msg)return;
  inp.value='';
  aiHistory.push({role:'user',content:msg});
  renderAIMsgs();
  const el=document.getElementById('aiMessages');
  const thinking=document.createElement('div');
  thinking.className='ai-msg ai';
  thinking.innerHTML=`<div class="ai-msg-header">🤖 AI Coach</div><div class="ai-thinking"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>`;
  el.appendChild(thinking);
  el.scrollTop=el.scrollHeight;
  try{
    const controller=new AbortController();
    const _t=setTimeout(()=>controller.abort(),25000);
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',signal:controller.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:AI_SYSTEM,messages:aiHistory.map(m=>({role:m.role,content:m.content}))})
    });
    clearTimeout(_t);
    const data=await res.json();
    const reply=data.content?.[0]?.text||'Try again!';
    thinking.remove();
    aiHistory.push({role:'assistant',content:reply});
    renderAIMsgs();
    saveState();
  }catch(e){
    clearTimeout(_t);
    thinking.remove();
    const isTimeout=e.name==='AbortError';
    const fallback=isTimeout?'Connection timed out. Check your internet and try again. In the meantime: '+getFallback(msg):getFallback(msg);
    aiHistory.push({role:'assistant',content:fallback});
    renderAIMsgs();
    saveState();
  }
}

function getFallback(msg){
  const l=msg.toLowerCase();
  if(l.includes('protein')) return 'Rob: 180g/day. Tre: 210g/day. Chicken, Greek yogurt, eggs, tuna, whey. Spread across 4-5 meals. This is the #1 non-negotiable.';
  if(l.includes('weight')||l.includes('load')) return 'Rob: controlled tempo, RPE 7-8, protect joints. Tre: push to RPE 8-9, add weight every session. Same exercise, different loading — that\'s the beauty of training together.';
  if(l.includes('cardio')) return 'Wed & Sat: 30 min brisk walk (Zone 2) for both. Tre can add 1-2 HIIT sessions. Rob: low-impact options preferred (bike, elliptical, rower).';
  if(l.includes('supplement')) return 'Priority list for both: Creatine 5g/day, Whey Protein, Vitamin D3+K2, Magnesium (sleep & recovery), Fish Oil (joints & inflammation).';
  if(l.includes('sleep')||l.includes('recover')) return 'Muscle grows during sleep. 7-9 hours non-negotiable. Rob: recovery is slower at 53 — sleep is your anabolic window. Tre: don\'t underestimate sleep even at 22.';
  return 'Focus on the fundamentals: progressive overload on main lifts, hit protein targets, sleep 8 hours. Results come from consistency, not perfection.';
}

document.getElementById('aiInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendAiMessage();});

// Detect tiiny.host banner and push nav above it
function fixNavForTiiny(){
  try{
    var nav=document.querySelector('.bottom-nav');
    if(!nav)return;
    // Check if we're in tiiny by looking for their iframe/banner elements
    // Tiiny injects a fixed banner - detect it by checking bottom space
    var isStandalone=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;
    // Always ensure nav is above any injected banners
    // Use a generous bottom value that clears both home indicator and any banner
    var safeBottom=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sab'))||0;
    // Check for tiiny banner by looking at page height vs window height
    if(window.location.hostname.includes('tiiny')||document.referrer.includes('tiiny')){
      nav.style.bottom='60px';
      document.querySelector('.scroll-area').style.paddingBottom='200px';
    }
  }catch(e){}
}

});
